<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><meta name="theme-color" content="#080808"><meta name="description" content="Cinema, games, books, music, and sports from Ahmed Khalil Daoudi’s personal collection."><link rel="canonical" href="https://daoudiahmedkhalil.com/personal.html"><meta property="og:type" content="website"><meta property="og:url" content="https://daoudiahmedkhalil.com/personal.html"><meta property="og:title" content="Personal | Ahmed Khalil Daoudi"><meta property="og:description" content="Cinema, games, books, music, and sports from Ahmed Khalil Daoudi’s personal collection."><meta property="og:image" content="https://daoudiahmedkhalil.com/assets/khalil-cutout-v3.webp"><meta name="twitter:card" content="summary_large_image"><title>Personal | Ahmed Khalil Daoudi</title><link rel="stylesheet" href="site.css"></head><body>
  <header class="masthead shell"><a class="brand" href="./#top" aria-label="Ahmed Khalil Daoudi, home"><span class="brand-mark">AK</span></a><nav aria-label="Main navigation"><a href="./#work">Work</a><a href="./#background">Background</a><a href="personal.html" aria-current="page">Personal</a><a href="./#contact">Contact</a></nav></header>
  <main class="shell">
    <section id="personal" class="section" aria-labelledby="personal-title"><div class="section-head"><h1 id="personal-title">Personal.</h1></div><div id="collections"></div>
      <section id="sports" class="collection" aria-labelledby="notes-title">
        <h2 id="notes-title" class="interest-lettering notes-title">Notes</h2>
        <div class="interest-stage">
          <blockquote class="interest-quote">
            <p>“It is a shame for a man to grow old without seeing the beauty and strength of which his body is capable.”</p>
          </blockquote>
          <img class="interest-portrait" src="assets/portraits/sports-profile.webp" width="480" height="600" alt="Ahmed in a side profile mirror portrait" loading="lazy">
        </div>
      </section>
    </section>
  </main>
  <footer class="shell"><span>© 2026 Ahmed Khalil Daoudi · Casablanca, Morocco</span></footer>
  <script>
    const collections = {
      Cinema: [['I Origins','2014'],['Parasite','2019'],['Heretic','2024'],['Decision to Leave','2022']],
      Games: [['The Witcher 3: Wild Hunt'],['Sekiro: Shadows Die Twice'],['Bloodborne'],['League of Legends'],['Elden Ring'],['Ghost of Tsushima'],['Dark Souls III'],['The Elder Scrolls V: Skyrim'],['Cyberpunk 2077']],
      Literature: [['Meditations','Marcus Aurelius'],['The Brothers Karamazov','Fyodor Dostoevsky'],['Crime and Punishment','Fyodor Dostoevsky'],['Anna Karenina','Leo Tolstoy'],['The Death of Ivan Ilyich','Leo Tolstoy'],['Thus Spoke Zarathustra','Friedrich Nietzsche'],['No Longer Human','Osamu Dazai'],['White Nights','Fyodor Dostoevsky']],
      Music: []
    };
    const images = {
      "The Elder Scrolls V: Skyrim": {"src": "assets/games/skyrim.webp", "width": 1200, "height": 675, "alt": "The Dragonborn in horned armor"},
      "Cyberpunk 2077": {"src": "assets/games/cyberpunk-2077.webp", "width": 1200, "height": 600, "alt": "Cyberpunk 2077 characters against a yellow city backdrop"},
      "No Longer Human": {"src": "assets/covers/no-longer-human.webp", "width": 672, "height": 1050, "alt": "Vintage red flower with an eye at its center", "titlePanel": true},
      "White Nights": {"src": "assets/covers/white-nights.webp", "width": 700, "height": 1050, "alt": "Lamplit riverside promenade at night", "titlePanel": true},
      "League of Legends": {"src": "assets/games/league-of-legends.webp", "width": 739, "height": 415, "alt": "League of Legends artwork"},
      "Heretic": {"src": "assets/films/heretic.webp", "width": 771, "height": 1050, "alt": "Heretic artwork"},
      "Parasite": {"src": "assets/films/parasite.webp", "width": 709, "height": 1050, "alt": "Parasite artwork"},
      "Decision to Leave": {"src": "assets/films/decision-to-leave.webp", "width": 735, "height": 1050, "alt": "Decision to Leave artwork"},
      "I Origins": {"src": "assets/films/i-origins.webp", "width": 787, "height": 1050, "alt": "I Origins artwork"},
      "The Death of Ivan Ilyich": {"src": "assets/covers/death-of-ivan-ilyich.webp", "width": 700, "height": 1050, "alt": "Painting of a reclining man in red", "titlePanel": true},
      "The Witcher 3: Wild Hunt": {"src": "assets/games/witcher-3.webp", "width": 590, "height": 336, "alt": "The Witcher 3: Wild Hunt artwork"},
      "Sekiro: Shadows Die Twice": {"src": "assets/games/sekiro.webp", "width": 1100, "height": 619, "alt": "Sekiro: Shadows Die Twice artwork"},
      "Bloodborne": {"src": "assets/games/bloodborne.webp", "width": 570, "height": 380, "alt": "Bloodborne artwork"},
      "Elden Ring": {"src": "assets/games/elden-ring.webp", "width": 1200, "height": 600, "alt": "Elden Ring artwork"},
      "Ghost of Tsushima": {"src": "assets/games/ghost-of-tsushima.webp", "width": 596, "height": 335, "alt": "Ghost of Tsushima artwork"},
      "Dark Souls III": {"src": "assets/games/dark-souls-3.webp", "width": 1200, "height": 675, "alt": "Dark Souls III artwork"},
      'Meditations': {src:'assets/covers/meditations.webp',width:700,height:1050,alt:'Cover of the Standard Ebooks edition of Meditations'},
      'The Brothers Karamazov': {src:'assets/covers/brothers-karamazov.webp',width:700,height:1050,alt:'Cover of the Standard Ebooks edition of The Brothers Karamazov'},
      'Crime and Punishment': {src:'assets/covers/crime-and-punishment.webp',width:700,height:1050,alt:'Cover of the Standard Ebooks edition of Crime and Punishment'},
      'Anna Karenina': {src:'assets/covers/anna-karenina.webp',width:700,height:1050,alt:'Cover of the Standard Ebooks edition of Anna Karenina'},
      'Thus Spoke Zarathustra': {src:'assets/covers/zarathustra.webp',width:700,height:1050,alt:'Cover of the Standard Ebooks edition of Thus Spoke Zarathustra'}
    };
    const root = document.querySelector('#collections');
    for (const [name, entries] of Object.entries(collections)) {
      const section = document.createElement('section'); section.className = `collection ${name.toLowerCase()}`;
      const gallery = document.createElement('div'); gallery.className = 'gallery';
      for (const [label, detail] of entries) {
        const figure = document.createElement('figure');
        if (images[label]) {
          const { titlePanel, ...image } = images[label];
          const img = document.createElement('img');
          Object.assign(img, image);
          img.loading = 'lazy';
          img.draggable = false;
          if (titlePanel) {
            const cover = document.createElement('div');
            cover.className = 'book-cover';
            const panel = document.createElement('div');
            panel.className = 'book-cover-label';
            panel.setAttribute('aria-hidden', 'true');
            const author = document.createElement('span');
            author.textContent = detail;
            panel.append(label, author);
            cover.append(img, panel);
            figure.append(cover);
          } else {
            figure.append(img);
          }
        } else {
          const pending = document.createElement('div'); pending.className = 'art'; pending.textContent = 'Artwork pending'; pending.setAttribute('aria-hidden', 'true'); figure.append(pending);
        }
        const caption = document.createElement('figcaption'); caption.textContent = label;
        if (detail) { const secondary = document.createElement('span'); secondary.textContent = detail; caption.append(secondary); }
        figure.append(caption); gallery.append(figure);
      }
      if (name === 'Music') {
        const genres = document.createElement('ul');
        genres.className = 'role-stack music-genres';
        for (const genre of ['Jazz', 'Metal', 'Classical', 'R&B / Soul', 'Instrumental']) {
          const item = document.createElement('li');
          item.textContent = genre;
          genres.append(item);
        }
        section.id = 'music';
        section.setAttribute('aria-label', 'Music');
        const stage = document.createElement('div');
        stage.className = 'interest-stage';
        const lettering = document.createElement('div');
        lettering.className = 'interest-lettering';
        lettering.setAttribute('aria-hidden', 'true');
        lettering.textContent = 'Music';
        const portrait = document.createElement('img');
        Object.assign(portrait, {
          className: 'interest-portrait',
          src: 'assets/portraits/music-oud.webp',
          width: 480,
          height: 600,
          alt: 'Ahmed seated and playing the oud',
          loading: 'lazy'
        });
        const guitar = document.createElement('img');
        Object.assign(guitar, {
          className: 'interest-portrait music-guitar',
          src: 'assets/portraits/music-guitar.webp',
          width: 900,
          height: 378,
          alt: 'Ahmed playing electric guitar',
          loading: 'lazy'
        });
        const center = document.createElement('div');
        center.className = 'music-center';
        center.append(lettering, genres);
        stage.append(portrait, center, guitar);
        section.append(stage);
      }
      if (entries.length) {
        const deck = document.createElement('div');
        deck.className = 'collection-deck';
        const title = document.createElement('h2');
        title.className = 'interest-lettering';
        title.id = name.toLowerCase() + '-title';
        title.textContent = name === 'Literature' ? 'Books' : name;
        section.setAttribute('aria-labelledby', title.id);
        const cards = Array.from(gallery.children);
        const controls = document.createElement('div');
        controls.className = 'deck-controls';
        gallery.tabIndex = 0;
        gallery.setAttribute('role', 'group');
        gallery.setAttribute('aria-label', title.textContent + ' carousel. Use the left and right arrow keys to browse.');
        const position = document.createElement('output');
        let active = 0;
        const buttons = cards.map((card, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', 'Show ' + entries[index][0]);
          button.addEventListener('click', () => {
            active = index;
            gallery.focus({preventScroll:true});
            showCards();
          });
          card.append(button);
          return button;
        });
        function showCards() {
          cards.forEach((card, index) => {
            const distance = (index - active + cards.length) % cards.length;
            card.dataset.slot = distance === 0 ? 'current' :
              distance === 1 ? 'next' : distance === cards.length - 1 ? 'previous' : 'offstage';
            const neighbor = distance === 1 || distance === cards.length - 1;
            buttons[index].hidden = !neighbor;
            card.setAttribute('aria-hidden', String(distance !== 0 && !neighbor));
            card.querySelector('img')?.setAttribute('aria-hidden', String(neighbor));
          });
          position.textContent = (active + 1) + ' / ' + cards.length;
          position.setAttribute('aria-label', cards[active].querySelector('figcaption').textContent);
        }
        function swap(direction) {
          active = (active + direction + cards.length) % cards.length;
          showCards();
        }
        showCards();
        gallery.addEventListener('keydown', event => {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          swap(event.key === 'ArrowLeft' ? -1 : 1);
        });
        controls.append(position);
        deck.append(title, gallery, controls);
        section.append(deck);
      }
      root.append(section);
    }
  </script>
</body></html>
