<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="site.css">
  <title>Birthday | Ahmed Khalil Daoudi</title>
  <script src="birthday.js" defer></script>
  <script src="birthday-orb.js" defer></script>
</head>
<body class="birthday-entry">
  <main class="birthday-page" aria-labelledby="birthday-title">
    <header class="birthday-masthead"><span aria-hidden="true">✳</span> Ahmed Khalil Daoudi</header>
    <canvas class="birthday-orb" aria-hidden="true"></canvas>
    <h1 id="birthday-title">When is my<br>birthday?</h1>
    <div class="birthday-answer">
      <form id="birthday-form">
        <label>Month <input name="month" type="number" inputmode="numeric" min="1" max="12" step="1" placeholder="MM" required></label>
        <label>Day <input name="day" type="number" inputmode="numeric" min="1" max="31" step="1" placeholder="DD" required></label>
        <button type="submit">Enter <span aria-hidden="true">↗</span></button>
      </form>
    </div>
  </main>
  <audio id="birthday-audio" src="assets/birthday-soundtrack.m4a" preload="none"></audio>
</body>
</html>
